name: Verify GMI API Secret

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify GMI_API_KEY is configured
        env:
          GMI_API_KEY: ${{ secrets.GMI_API_KEY }}
        run: |
          if [ -z "$GMI_API_KEY" ]; then
            echo "::error::GMI_API_KEY is not configured for this repository."
            exit 1
          fi
          echo "GMI_API_KEY is configured."
          echo "Secret length: ${#GMI_API_KEY} characters (value intentionally hidden)."
